# Gate for every push/PR: the Regular faces (upright and italic), the Light
# Italic erosion path, one Nerd Fonts patch and the variable Sumi Moji,
# each assembled from the live upstreams in its own job so the whole run
# fits in a few minutes. The full 36-face build happens in release.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # upstream-sync.yml dispatches this on its own branch: a pull_request run
  # for a bot-opened PR lands in action_required, so the checks that gate the
  # merge have to come from a run this repo started itself.
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check scripts/ tests/
      - run: python -m pytest tests/ -q
  # one weight and style per job: the Latin donors (build_latin.py), the
  # JP faces on top (build.py), the shaping regression tests, and — in the
  # Nerd Font job — FontPatcher on the Term face and the Sumi Moji face
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Regular
            filter: Regular Upright
            verify: >-
              dist/ShoyuCodeProJP-Regular.otf
              dist/ShoyuCodeProJP35-Regular.otf
              dist/ShoyuCodeProJPTerm-Regular.otf
            verify_latin: >-
              dist/latin/SumiMoji-Regular.otf
              dist/latin/term/SumiMojiTerm-Regular.otf
          - name: Regular Italic
            filter: Regular Italic
            verify: >-
              dist/ShoyuCodeProJP-RegularItalic.otf
              dist/ShoyuCodeProJP35-RegularItalic.otf
              dist/ShoyuCodeProJPTerm-RegularItalic.otf
            verify_latin: dist/latin/SumiMoji-RegularItalic.otf
          # Light is the only weight that hits Monaspace's wght floor and
          # takes the erosion path (mona_glyphset / erode_path)
          - name: Light Italic
            filter: Light Italic
            verify: dist/ShoyuCodeProJP-LightItalic.otf
            verify_latin: dist/latin/SumiMoji-LightItalic.otf
          # the Term Regular face and the Sumi Moji Regular face through
          # FontPatcher (nerdpatch.py takes every face in dist/, which is
          # just these two here), then the patched outputs verified
          - name: Nerd Font
            latin_filter: Regular Upright
            filter: Regular Upright Term
            nerd: true
            verify: dist/nerd/ShoyuCodeProJPTermNF-Regular.otf
            verify_latin: dist/nerd/latin/SumiMojiNF-Regular.otf
    name: faces (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
        with:
          fontforge: ${{ matrix.nerd && 'true' || 'false' }}
      # the Latin layer (Sumi Moji, provisional name) is assembled first
      # from the VFs; build.py grafts it into Source Han Sans
      - run: python scripts/build_latin.py "${{ matrix.latin_filter || matrix.filter }}"
      - run: python scripts/build.py "${{ matrix.filter }}"
      - if: matrix.nerd
        run: python scripts/nerdpatch.py FontPatcher
      - name: Verify
        run: |
          rc=0
          for f in ${{ matrix.verify_latin }}; do
            python scripts/verify_latin.py "$f" || rc=1
          done
          for f in ${{ matrix.verify }}; do
            python scripts/verify.py "$f" || rc=1
          done
          exit $rc
  # the variable Sumi Moji needs only the upstreams (upright only here,
  # Italic is covered in release.yml); verify_latin_vf.py's static-face
  # comparison skips when dist/latin has no statics and its check against
  # Source Code Pro itself still runs
  variable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: python scripts/build_latin_vf.py upright
      - run: python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
  # one required check over the matrix (upstream-sync.yml waits on
  # "lint-test" and "build" by name)
  build:
    runs-on: ubuntu-latest
    needs: [faces, variable]
    if: always()
    steps:
      - run: |
          echo "faces: ${{ needs.faces.result }}; variable: ${{ needs.variable.result }}"
          [ "${{ needs.faces.result }}" = success ] && [ "${{ needs.variable.result }}" = success ]
