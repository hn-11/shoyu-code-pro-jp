# Gate for every push/PR, in about a minute: the Regular faces (upright
# and italic) and the Light Italic faces (the erosion path) of both
# families, the variable Sumi Moji and the Nerd Fonts graft, assembled from
# the live upstreams in eight parallel jobs (around ten, jobs start to
# queue behind each other and finish late). upstream-sync.yml waits on
# these jobs by name (REQUIRED_CHECKS there): renaming one here means
# renaming it there. The full 20-face build happens in release.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # upstream-sync.yml dispatches this on its own branch: a pull_request run
  # for a bot-opened PR lands in action_required, so the checks that gate the
  # merge have to come from a run this repo started itself.
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check scripts/ tests/
      - run: python -m pytest tests/ -q
  # one weight, style and family per job: the Latin donor (build_latin.py),
  # then the JP face on top (build.py), then both verified side by side;
  # the Regular Upright jobs also graft the Nerd Fonts symbols into the
  # JP face (nerdpatch.py) and verify that
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        face: [Regular Upright, Regular Italic, Light Italic]
        family: [base, Term]
        include:
          - face: Regular Upright
            nerd: "true"
    name: faces (${{ matrix.face }} ${{ matrix.family }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      # the Latin layer (Sumi Moji, provisional name) is assembled first
      # from the VFs; build.py grafts it into Source Han Sans
      - run: python scripts/build_latin.py "${{ matrix.face }}"
      - run: python scripts/build.py "${{ matrix.face }} ${{ matrix.family }}"
      - if: matrix.nerd
        run: python scripts/nerdpatch.py dist/*.otf
      - run: python scripts/verify_many.py 'dist/latin/*.otf' 'dist/*.otf' 'dist/nerd/*.otf'
  # the variable Sumi Moji (upright only here, Italic is covered in
  # release.yml; verify_latin_vf.py's static-face comparison skips when
  # dist/latin has no statics and its check against Source Code Pro
  # itself still runs), then nerdpatch.py on the Sumi Moji Regular face
  # (the complete symbol set: the graft takes seconds)
  variable-nerd-font:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: variable + Nerd Font
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: python scripts/build_latin_vf.py upright
      - run: python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
      - run: python scripts/build_latin.py "Regular Upright"
      - run: python scripts/nerdpatch.py dist/latin/SumiMoji-Regular.otf
      - run: python scripts/verify_latin.py dist/nerd/latin/SumiMojiNFM-Regular.otf
