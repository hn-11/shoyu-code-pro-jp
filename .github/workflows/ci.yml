# Gate for every push/PR, in about a minute: every Regular face (upright and
# italic), the Light Italic faces (the erosion path), the variable Sumi
# Moji and a Nerd Fonts patch, one face per job, each assembled from the
# live upstreams. upstream-sync.yml waits on these jobs by name
# (REQUIRED_CHECKS there): renaming one here means renaming it there.
# The full 36-face build happens in release.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # upstream-sync.yml dispatches this on its own branch: a pull_request run
  # for a bot-opened PR lands in action_required, so the checks that gate the
  # merge have to come from a run this repo started itself.
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check scripts/ tests/
      - run: python -m pytest tests/ -q
  # one JP face per job: its Latin donor (build_latin.py, the one profile
  # the face reads), the face on top (build.py), both verified
  face:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        face: [Regular Upright, Regular Italic, Light Italic]
        family: [base, 35, Term]
        include:
          - family: base
            latin: ship
          - family: 35
            latin: ship
          - family: Term
            latin: term
    name: face (${{ matrix.face }} ${{ matrix.family }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      # the Latin layer (Sumi Moji, provisional name) is assembled first
      # from the VFs; build.py grafts it into Source Han Sans
      - run: python scripts/build_latin.py "${{ matrix.face }} ${{ matrix.latin }}"
      - run: python scripts/build.py "${{ matrix.face }} ${{ matrix.family }}"
      # the donor (dist/latin/ or dist/latin/term/) and the face — verify_many
      # expands the patterns itself, so the empty directory is no error
      - run: python scripts/verify_many.py 'dist/latin/*/*.otf' 'dist/latin/*.otf' 'dist/*.otf'
  # the variable Sumi Moji needs only the upstreams (upright only here,
  # Italic is covered in release.yml); verify_latin_vf.py's static-face
  # comparison skips when dist/latin has no statics and its check against
  # Source Code Pro itself still runs
  variable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: python scripts/build_latin_vf.py upright
      - run: python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
  # nerdpatch.py end to end on the Sumi Moji Regular face (a CID-keyed
  # CFF like the JP faces: FontForge's flattening, font-patcher, the
  # renaming and the icon fitting all run), with one symbol set —
  # font-patcher's --complete takes a minute a face regardless of the
  # face's size, so the release is where every face gets everything
  nerd-font:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
        with:
          fontforge: "true"
      - run: python scripts/build_latin.py "Regular Upright ship"
      - run: python scripts/nerdpatch.py FontPatcher
        env:
          SHOYU_NERD_SETS: --powerline
      - run: python scripts/verify_latin.py dist/nerd/latin/SumiMojiNF-Regular.otf
