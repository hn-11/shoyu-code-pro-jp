# Gate for every push/PR: assemble the Regular faces from live upstreams
# and run the shaping regression test. Full build happens in release.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # upstream-sync.yml dispatches this on its own branch: a pull_request run
  # for a bot-opened PR lands in action_required, so the checks that gate the
  # merge have to come from a run this repo started itself.
  workflow_dispatch:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest fonttools
      - run: ruff check scripts/
      - run: python -m pytest tests/ -q
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch upstreams
        id: upstreams
        uses: ./.github/actions/fetch-upstreams
      - name: Export upstream paths
        run: |
          echo "SHCJ_TTC=${{ steps.upstreams.outputs.shcj_ttc }}" >> "$GITHUB_ENV"
          echo "SHS_DIR=${{ steps.upstreams.outputs.shs_dir }}" >> "$GITHUB_ENV"
          echo "SCP_VF_U=${{ steps.upstreams.outputs.scp_vf_u }}" >> "$GITHUB_ENV"
          echo "SCP_VF_I=${{ steps.upstreams.outputs.scp_vf_i }}" >> "$GITHUB_ENV"
          echo "MONA_VF=${{ steps.upstreams.outputs.mona_vf }}" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fontforge python3-fontforge
      - name: Fetch FontPatcher (cached)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: fp
        with:
          path: FontPatcher
          key: fontpatcher-v3.4.0
      - if: steps.fp.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/FontPatcher.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FontPatcher.zip
          unzip -qo /tmp/FontPatcher.zip -d FontPatcher
      - run: python scripts/build.py "Regular"
      - run: python scripts/verify.py dist/ShoyuCodeProJP-Regular.otf
      - run: python scripts/verify.py dist/ShoyuCodeProJP35-Regular.otf
      - run: python scripts/verify.py dist/ShoyuCodeProJP-RegularItalic.otf
      - name: Nerd-patch smoke test (one font)
        run: python scripts/nerdpatch.py FontPatcher ShoyuCodeProJP35-Regular
      - name: Verify NF-patched font
        run: |
          nf_font=$(find dist/nerd -name '*.otf' | head -1)
          echo "verifying: $nf_font"
          python scripts/verify.py "$nf_font"
