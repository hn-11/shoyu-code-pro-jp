# Tag push (v*) -> full assembly from live upstreams (6 weights x 2 styles
# x 3 families = 36 faces plus the 12 Sumi Moji statics and the two
# variable fonts), verify, Nerd-patch everything, zip, GitHub release.
#
# One weight and style per job — its Latin donors, its three JP faces,
# their Nerd Fonts patches (the Sumi Moji one patched while the JP faces
# build), verified side by side and uploaded as an artifact — with the two
# variable fonts built beside them; the package job assembles dist/ from
# the artifacts, harmonizes the Latin families' win metrics (a per-job
# build never sees a family whole), bundles the collections and publishes.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.4.0)"
        required: true
      dry-run:
        description: "Build and package only: no tag, no release (timing the workflow)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  SHOYU_VERSION_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        weight: [Light, Normal, Regular, Medium, Bold, Heavy]
        style: [Upright, Italic]
    name: faces (${{ matrix.weight }} ${{ matrix.style }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
        with:
          fontforge: "true"
      - run: echo "SHOYU_VERSION=${SHOYU_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - run: python scripts/build_latin.py "${{ matrix.weight }} ${{ matrix.style }}"
      - name: Build the JP faces, patching Sumi Moji meanwhile
        run: |
          python scripts/nerdpatch.py FontPatcher SumiMoji- > nerd-latin.log 2>&1 &
          latin=$!
          python scripts/build.py "${{ matrix.weight }} ${{ matrix.style }}"
          python scripts/nerdpatch.py FontPatcher ShoyuCodeProJP
          wait $latin || { cat nerd-latin.log; exit 1; }
          cat nerd-latin.log
      - run: >-
          python scripts/verify_many.py
          dist/*.otf dist/nerd/*.otf dist/latin/*.otf dist/nerd/latin/*.otf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faces-${{ matrix.weight }}-${{ matrix.style }}
          path: |
            dist/*.otf
            dist/latin/*.otf
            dist/latin/term/*.otf
            dist/nerd/*.otf
            dist/nerd/latin/*.otf
          if-no-files-found: error
          retention-days: 7
  variable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - style: upright
            font: SumiMoji[wght].otf
          - style: italic
            font: SumiMoji-Italic[wght].otf
    name: variable (${{ matrix.style }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: echo "SHOYU_VERSION=${SHOYU_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - run: python scripts/build_latin_vf.py ${{ matrix.style }}
      # against Source Code Pro itself here; the comparison with the static
      # faces runs in the package job, where both are present
      - run: python scripts/verify_latin_vf.py "dist/latin/${{ matrix.font }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: variable-${{ matrix.style }}
          path: dist/latin/*.otf
          if-no-files-found: error
          retention-days: 7
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [faces, variable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: faces-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: variable-*
          path: dist/latin
          merge-multiple: true
      - run: python scripts/harmonize_latin.py
      - name: Verify the variable fonts against the static faces
        run: |
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji-Italic[wght].otf"
      - run: >-
          python scripts/verify_many.py
          dist/latin/SumiMoji-Regular.otf dist/nerd/latin/SumiMojiNF-BoldItalic.otf
      - run: python scripts/makeotc.py
      - run: |
          cp LICENSE dist/LICENSE
          cp LICENSE dist/nerd/LICENSE
          cp LICENSE dist/latin/LICENSE
          cp LICENSE dist/nerd/latin/LICENSE
          cd dist && zip -q ShoyuCodeProJP.zip *.otf LICENSE
          (cd latin && zip -q ../SumiMoji.zip *.otf LICENSE)
          cd nerd && zip -q ../ShoyuCodeProJP-NerdFont.zip *.otf LICENSE
          (cd latin && zip -q ../../SumiMoji-NerdFont.zip *.otf LICENSE)
      - name: Extract changelog section for this tag
        run: |
          awk -v tag="## ${SHOYU_VERSION_TAG}" '
            $0 == tag {flag=1; next}
            flag && /^## / {flag=0}
            flag
          ' CHANGELOG.md > release_notes.md
      - if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # on dispatch the tag doesn't exist yet; gh-release creates it
          # at the built commit. Tag pushes keep working unchanged.
          tag_name: ${{ env.SHOYU_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/ShoyuCodeProJP.zip
            dist/SumiMoji.zip
            dist/ShoyuCodeProJP-NerdFont.zip
            dist/SumiMoji-NerdFont.zip
            dist/ShoyuCodeProJP.ttc
            dist/ShoyuCodeProJP35.ttc
            dist/ShoyuCodeProJPTerm.ttc
            dist/SumiMoji.ttc
