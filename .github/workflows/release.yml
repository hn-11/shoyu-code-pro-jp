# Tag push (v*) -> full assembly from live upstreams (6 weights x 2 styles
# x 3 families = 36 faces plus the 12 Sumi Moji statics and the two
# variable fonts), verify, Nerd-patch everything, zip, GitHub release.
#
# A family's two weights per job — its Latin donors, its four JP faces,
# their Nerd Fonts patches and a share of the Sumi Moji ones (patched
# while the JP faces build), verified side by side and uploaded as an
# artifact; the package job builds the two variable fonts, assembles
# dist/ from the artifacts, harmonizes the Latin families' win metrics (a
# per-job build never sees a family whole), bundles the collections and
# publishes.
name: Release
on:
  push:
    tags: ["v*"]
    # a branch push whose commit message carries [release-dry] is a dry
    # run: the workflow as of that commit builds and packages, publishes
    # nothing — timing a change to this file before it is on main (a push
    # without the marker runs nothing; workflow_dispatch is not open to
    # every token)
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.4.0)"
        required: true
      dry-run:
        description: "Build and package only: no tag, no release (timing the workflow)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  SHOYU_VERSION_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dry' }}
  # the runs that publish: a v* tag, or a dispatch without dry-run
  PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
jobs:
  # a family's two weights, both styles, per job (nine jobs: more than
  # about ten queue behind each other): its four Latin donors, its four
  # JP faces, and the Nerd Fonts patches — the JP faces' own, plus two of
  # the Sumi Moji faces (base: upright, 35: italic) patched while the JP
  # faces build. Two of the Term jobs (the lightest: four patches) also
  # build one variable font each, for the package job to pick up
  faces:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-dry]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [base, 35, Term]
        weights: [Light Normal, Regular Medium, Bold Heavy]
        include:
          - family: base
            latin: ship
            latin_nf: upright
          - family: 35
            latin: ship
            latin_nf: italic
          - family: Term
            latin: term
          - family: Term
            weights: Light Normal
            variable: upright
          - family: Term
            weights: Regular Medium
            variable: italic
    name: faces (${{ matrix.family }} ${{ matrix.weights }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
        with:
          fontforge: "true"
      - run: echo "SHOYU_VERSION=${SHOYU_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - run: python scripts/build_latin.py "${{ matrix.weights }} ${{ matrix.latin }}"
      - name: Build the JP faces and patch everything
        env:
          LATIN_NF: ${{ matrix.latin_nf }}
        run: |
          latin=
          if [ -n "$LATIN_NF" ]; then
            faces=$(for w in ${{ matrix.weights }}; do
              echo "dist/latin/SumiMoji-$w$([ "$LATIN_NF" = italic ] && echo Italic).otf"
            done)
            python scripts/nerdpatch.py FontPatcher $faces > nerd-latin.log 2>&1 &
            latin=$!
          fi
          python scripts/build.py "${{ matrix.weights }} ${{ matrix.family }}"
          python scripts/nerdpatch.py FontPatcher dist/*.otf
          if [ -n "$latin" ]; then
            wait $latin || { cat nerd-latin.log; exit 1; }
            cat nerd-latin.log
          fi
      - if: matrix.variable
        run: python scripts/build_latin_vf.py ${{ matrix.variable }}
      # the statics and NF faces; a variable font, when this job built one,
      # is dist/latin/SumiMoji*[wght].otf and rides along (verify_latin_vf
      # runs in the package job, against every static)
      - run: >-
          python scripts/verify_many.py
          'dist/*.otf' 'dist/nerd/*.otf' 'dist/latin/SumiMoji-*.otf' 'dist/nerd/latin/*.otf'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faces-${{ matrix.family }}-${{ strategy.job-index }}
          path: |
            dist/*.otf
            dist/latin/*.otf
            dist/latin/term/*.otf
            dist/nerd/*.otf
            dist/nerd/latin/*.otf
          if-no-files-found: error
          retention-days: 7
  # the faces and the variable fonts from the artifacts, then the bundles
  # and the release
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: faces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: faces-*
          path: dist
          merge-multiple: true
      - run: python scripts/harmonize_latin.py
      - name: Verify the variable fonts against the static faces
        run: |
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji-Italic[wght].otf"
      - run: >-
          python scripts/verify_many.py
          dist/latin/SumiMoji-Regular.otf dist/nerd/latin/SumiMojiNF-BoldItalic.otf
      - run: python scripts/makeotc.py
      - run: |
          cp LICENSE dist/LICENSE
          cp LICENSE dist/nerd/LICENSE
          cp LICENSE dist/latin/LICENSE
          cp LICENSE dist/nerd/latin/LICENSE
          cd dist && zip -q ShoyuCodeProJP.zip *.otf LICENSE
          (cd latin && zip -q ../SumiMoji.zip *.otf LICENSE)
          cd nerd && zip -q ../ShoyuCodeProJP-NerdFont.zip *.otf LICENSE
          (cd latin && zip -q ../../SumiMoji-NerdFont.zip *.otf LICENSE)
      - name: Extract changelog section for this tag
        run: |
          awk -v tag="## ${SHOYU_VERSION_TAG}" '
            $0 == tag {flag=1; next}
            flag && /^## / {flag=0}
            flag
          ' CHANGELOG.md > release_notes.md
      - if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # on dispatch the tag doesn't exist yet; gh-release creates it
          # at the built commit. Tag pushes keep working unchanged.
          tag_name: ${{ env.SHOYU_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/ShoyuCodeProJP.zip
            dist/SumiMoji.zip
            dist/ShoyuCodeProJP-NerdFont.zip
            dist/SumiMoji-NerdFont.zip
            dist/ShoyuCodeProJP.ttc
            dist/ShoyuCodeProJP35.ttc
            dist/ShoyuCodeProJPTerm.ttc
            dist/SumiMoji.ttc
