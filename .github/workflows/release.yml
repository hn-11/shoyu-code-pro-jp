# Tag push (v*) -> full assembly from live upstreams: 42 static fonts across
# 3 families plus one variable font per family, verify, Nerd-patch the
# statics, zip, GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  SHS_TAG: 2.005R
  SCP_TAG: 2.042R-u%2F1.062R-i%2F1.026R-vf
  SCP_VF_ZIP: VF-source-code-VF-1.026R.zip
  MONA_TAG: v1.400
  SHMONO_TAG: 1.002
  # the variable release lives in the repo, not in a release asset
  SHS_VF_REF: release
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch upstreams
        run: |
          mkdir -p upstreams
          curl -sSfL -o upstreams/shcj.ttc \
            https://github.com/adobe-fonts/source-han-code-jp/releases/download/2.012R/SourceHanCodeJP.ttc
          curl -sSfL -o /tmp/shs.zip \
            "https://github.com/adobe-fonts/source-han-sans/releases/download/${SHS_TAG}/17_SourceHanSansJP.zip"
          unzip -qo /tmp/shs.zip -d upstreams/shs
          curl -sSfL -o /tmp/scp.zip \
            "https://github.com/adobe-fonts/source-code-pro/releases/download/${SCP_TAG}/${SCP_VF_ZIP}"
          unzip -qo /tmp/scp.zip -d upstreams/scp
          curl -sSfL -o /tmp/mona.zip \
            "https://github.com/githubnext/monaspace/releases/download/${MONA_TAG}/monaspace-variable-${MONA_TAG}.zip"
          unzip -qo /tmp/mona.zip -d upstreams/mona
          curl -sSfL -o upstreams/shmono.ttc \
            "https://github.com/adobe-fonts/source-han-mono/releases/download/${SHMONO_TAG}/SourceHanMono.ttc"
          curl -sSfL -o upstreams/shs-vf.ttc \
            "https://raw.githubusercontent.com/adobe-fonts/source-han-sans/${SHS_VF_REF}/Variable/OTC/SourceHanSans-VF.otf.ttc"
      - name: Export upstream paths
        run: |
          echo "SHCJ_TTC=upstreams/shcj.ttc" >> "$GITHUB_ENV"
          echo "SHS_DIR=$(dirname "$(find upstreams/shs -name 'SourceHanSansJP-Regular.otf' | head -1)")" >> "$GITHUB_ENV"
          echo "SCP_VF_U=$(find upstreams/scp -name 'SourceCodeVF-Upright.otf' | head -1)" >> "$GITHUB_ENV"
          echo "SCP_VF_I=$(find upstreams/scp -name 'SourceCodeVF-Italic.otf' | head -1)" >> "$GITHUB_ENV"
          echo "MONA_VF=$(find upstreams/mona -name 'Monaspace Neon Var.ttf' | head -1)" >> "$GITHUB_ENV"
          echo "SHMONO_TTC=upstreams/shmono.ttc" >> "$GITHUB_ENV"
          echo "SHS_VF=upstreams/shs-vf.ttc" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fontforge python3-fontforge
      - run: |
          curl -sSfL -o /tmp/FontPatcher.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FontPatcher.zip
          unzip -qo /tmp/FontPatcher.zip -d FontPatcher
      - run: python scripts/build.py
      - run: python scripts/verify.py dist/ShoyuCodeProJP-Regular.otf
      - run: python scripts/verify.py dist/ShoyuCodeProJP35-Heavy.otf
      - run: python scripts/nerdpatch.py FontPatcher
      - run: python scripts/makeotc.py
      - run: |
          cd dist && zip -q ShoyuCodeProJP.zip *-*.otf
          cd nerd && zip -q ../ShoyuCodeProJP-NerdFont.zip *.otf
      # variable families last: they reuse dist/ and must not land in the
      # static zip above
      - run: python scripts/build_vf.py
      - run: |
          for f in dist/*-VF.otf; do python scripts/verify.py "$f"; done
          cd dist && zip -q ShoyuCodeProJP-Variable.zip *-VF.otf
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShoyuCodeProJP.zip
            dist/ShoyuCodeProJP-NerdFont.zip
            dist/ShoyuCodeProJP.ttc
            dist/ShoyuCodeProJP35.ttc
            dist/ShoyuCodeProJPTerm.ttc
            dist/ShoyuCodeProJP-Variable.zip
