# Tag push (v*) -> full assembly from live upstreams (5 weights x 2 styles
# x 2 families = 20 faces plus the 10 Sumi Moji statics and the two
# variable fonts), verify, graft the Nerd Fonts symbols into everything,
# zip, GitHub release.
# Sumi Moji itself ships as the two variable fonts (its statics are the
# JP faces' donors, the Nerd Fonts patch's input and the variable fonts'
# check, not an asset); the JP families ship as statics, one zip per
# family (and per family for their Nerd Fonts patches: a download is the
# family a user installs). No collections: the release unit is the file
# a user installs.
#
# A family's weights per job — its Latin donors, its JP faces, their
# Nerd Fonts patches and a share of the Sumi Moji ones (patched while
# the JP faces build), verified side by side and uploaded as an
# artifact; the package job assembles dist/ from the artifacts,
# harmonizes the Latin families' win metrics (a per-job build never sees
# a family whole), zips and publishes.
name: Release
on:
  push:
    tags: ["v*"]
    # a branch push whose commit message carries [release-dry] is a dry
    # run: the workflow as of that commit builds and packages, publishes
    # nothing — timing a change to this file before it is on main (a push
    # without the marker runs nothing; workflow_dispatch is not open to
    # every token)
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.4.0)"
        required: true
      dry-run:
        description: "Build and package only: no tag, no release (timing the workflow)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  SUMI_VERSION_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dry' }}
  # the runs that publish: a v* tag, or a dispatch without dry-run
  PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
jobs:
  # a family's weights, both styles, per job (six jobs): its Latin donors,
  # its JP faces, and the Nerd Fonts grafts — the JP faces' own, plus a
  # share of the ten Sumi Moji ones, grafted while the JP faces build:
  # the base job the job's uprights, the Term job its italics. The two
  # Bold jobs (two faces each, the lightest) also build one variable
  # font each, for the package job to pick up
  faces:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-dry]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [base, Term]
        weights: [Light Regular, Medium SemiBold, Bold]
        include:
          - family: base
            latin_nf: Upright
          - family: Term
            latin_nf: Italic
          - family: base
            weights: Bold
            variable: upright
          - family: Term
            weights: Bold
            variable: italic
    name: faces (${{ matrix.family }} ${{ matrix.weights }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - run: echo "SUMI_VERSION=${SUMI_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - run: python scripts/build_latin.py "${{ matrix.weights }}"
      - name: Build the JP faces and graft the symbols into everything
        env:
          LATIN_NF: ${{ matrix.latin_nf }}
        run: |
          # this job's share of the Sumi Moji grafts: its weights' uprights
          # (base) or italics (Term)
          faces=""
          for w in ${{ matrix.weights }}; do
            case "$LATIN_NF" in
              Upright) faces="$faces dist/latin/SumiMoji-$w.otf" ;;
              Italic) faces="$faces dist/latin/SumiMoji-${w}Italic.otf" ;;
            esac
          done
          # an empty list would mean "patch everything" — the same faces
          # the foreground run below writes, at the same time
          [ -n "$faces" ] || { echo "no Sumi Moji faces for LATIN_NF='$LATIN_NF'"; exit 1; }
          python scripts/nerdpatch.py $faces > nerd-latin.log 2>&1 &
          latin=$!
          # neither the JP build nor the foreground graft may take the
          # step down before the background one is waited on: its log
          # lives only here
          jp=0
          python scripts/build.py "${{ matrix.weights }} ${{ matrix.family }}" \
            && python scripts/nerdpatch.py dist/*.otf || jp=$?
          wait $latin || { cat nerd-latin.log; exit 1; }
          cat nerd-latin.log
          [ "$jp" = 0 ] || exit "$jp"
      - if: matrix.variable
        run: python scripts/build_latin_vf.py ${{ matrix.variable }}
      # the statics and NF faces; a variable font, when this job built one,
      # is dist/latin/SumiMoji*[wght].otf and rides along (verify_latin_vf
      # runs in the package job, against every static)
      - run: >-
          python scripts/verify_many.py
          'dist/*.otf' 'dist/nerd/*.otf' 'dist/latin/SumiMoji-*.otf' 'dist/nerd/latin/*.otf'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faces-${{ matrix.family }}-${{ strategy.job-index }}
          path: |
            dist/*.otf
            dist/latin/*.otf
            dist/nerd/*.otf
            dist/nerd/latin/*.otf
          if-no-files-found: error
          retention-days: 7
  # the faces and the variable fonts from the artifacts, then the zips
  # and the release
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: faces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: faces-*
          path: dist
          merge-multiple: true
      - run: python scripts/harmonize_latin.py
      - name: Verify the variable fonts against the static faces
        run: |
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji-Italic[wght].otf"
      - run: >-
          python scripts/verify_many.py
          dist/latin/SumiMoji-Regular.otf dist/nerd/latin/SumiMojiNFM-BoldItalic.otf
      - run: |
          cp LICENSE dist/LICENSE
          cp LICENSE dist/nerd/LICENSE
          cp LICENSE dist/latin/LICENSE
          cp LICENSE dist/nerd/latin/LICENSE
          # the Nerd Fonts symbols' own license rides with the faces that carry them
          cp "$NF_LICENSE" dist/nerd/LICENSE-NerdFonts
          cp "$NF_LICENSE" dist/nerd/latin/LICENSE-NerdFonts
          # one zip per family: "SumiMojiJP-*" is the base family alone
          # (Term carries its own prefix)
          cd dist
          for fam in SumiMojiJP SumiMojiJPTerm; do
            zip -q "$fam.zip" "$fam"-*.otf LICENSE
            (cd nerd && zip -q "../$fam-NerdFont.zip" "$fam"NFM-*.otf LICENSE LICENSE-NerdFonts)
          done
          (cd latin && zip -q ../SumiMoji.zip 'SumiMoji[wght].otf' 'SumiMoji-Italic[wght].otf' LICENSE)
          (cd nerd/latin && zip -q ../../SumiMoji-NerdFont.zip *.otf LICENSE LICENSE-NerdFonts)
      # every asset, on a dry run too (a missing one is a failure here, not
      # a warning from the release step). By name and by content: `zip`
      # exits 0 when its *.otf argument matches nothing, because LICENSE
      # always matches, so `ls` alone would have shipped a zip holding
      # two licence files and no font
      - name: Every release asset exists and carries its fonts
        run: |
          want="SumiMojiJP:10 SumiMojiJPTerm:10 SumiMoji:2
                SumiMojiJP-NerdFont:10 SumiMojiJPTerm-NerdFont:10
                SumiMoji-NerdFont:10"
          for spec in $want; do
            zip="dist/${spec%%:*}.zip"
            n="${spec##*:}"
            [ -f "$zip" ] || { echo "::error::$zip missing"; exit 1; }
            got=$(unzip -Z1 "$zip" | grep -c '\.otf$' || true)
            [ "$got" = "$n" ] || { echo "::error::$zip has $got fonts, want $n"; exit 1; }
          done
          ls -l dist/*.zip
      - name: Extract changelog section for this tag
        run: |
          awk -v tag="## ${SUMI_VERSION_TAG}" '
            $0 == tag {flag=1; next}
            flag && /^## / {flag=0}
            flag
          ' CHANGELOG.md > release_notes.md
      - if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # on dispatch the tag doesn't exist yet; gh-release creates it
          # at the built commit. Tag pushes keep working unchanged.
          tag_name: ${{ env.SUMI_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/SumiMojiJP.zip
            dist/SumiMojiJPTerm.zip
            dist/SumiMojiJP-NerdFont.zip
            dist/SumiMojiJPTerm-NerdFont.zip
            dist/SumiMoji.zip
            dist/SumiMoji-NerdFont.zip
