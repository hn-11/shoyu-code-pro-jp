# Tag push (v*) -> full assembly from live upstreams (42 fonts x 3 families),
# verify, Nerd-patch everything, zip, GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # NOTE on matrix parallelism: the 3 families (2:3 / Term / 35) could in
    # principle be split into a build matrix, but build.py currently invokes
    # as a single process over all families/weights and a separate agent is
    # adding in-process parallelism there instead. Revisit a matrix split
    # only if that in-process work turns out insufficient — splitting here
    # would also complicate the single makeotc.py / zip / release steps
    # below, which currently assume all fonts land in one dist/.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch upstreams
        id: upstreams
        uses: ./.github/actions/fetch-upstreams
      - name: Export upstream paths
        run: |
          echo "SHCJ_TTC=${{ steps.upstreams.outputs.shcj_ttc }}" >> "$GITHUB_ENV"
          echo "SHS_DIR=${{ steps.upstreams.outputs.shs_dir }}" >> "$GITHUB_ENV"
          echo "SCP_VF_U=${{ steps.upstreams.outputs.scp_vf_u }}" >> "$GITHUB_ENV"
          echo "SCP_VF_I=${{ steps.upstreams.outputs.scp_vf_i }}" >> "$GITHUB_ENV"
          echo "MONA_VF=${{ steps.upstreams.outputs.mona_vf }}" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fontforge python3-fontforge
      - name: Fetch FontPatcher (cached)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: fp
        with:
          path: FontPatcher
          key: fontpatcher-v3.4.0
      - if: steps.fp.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/FontPatcher.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FontPatcher.zip
          unzip -qo /tmp/FontPatcher.zip -d FontPatcher
      - run: python scripts/build.py
      - run: python scripts/verify.py dist/ShoyuCodeProJP-Regular.otf
      - run: python scripts/verify.py dist/ShoyuCodeProJP35-Heavy.otf
      - run: python scripts/verify.py dist/ShoyuCodeProJP-RegularItalic.otf
      - run: python scripts/nerdpatch.py FontPatcher
      - name: Verify a Nerd Font-patched output
        run: |
          nf_font=$(find dist/nerd -name '*.otf' | head -1)
          echo "verifying: $nf_font"
          python scripts/verify.py "$nf_font"
      - run: python scripts/makeotc.py
      - run: |
          cd dist && zip -q ShoyuCodeProJP.zip *.otf
          cd nerd && zip -q ../ShoyuCodeProJP-NerdFont.zip *.otf
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/ShoyuCodeProJP.zip
            dist/ShoyuCodeProJP-NerdFont.zip
            dist/ShoyuCodeProJP.ttc
            dist/ShoyuCodeProJP35.ttc
            dist/ShoyuCodeProJPTerm.ttc
