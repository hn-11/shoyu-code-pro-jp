# Tag push (v*) -> full assembly from live upstreams (6 weights x 2 styles
# x 3 families = 36 faces plus the 12 Sumi Moji statics and the two
# variable fonts), verify, Nerd-patch everything, zip, GitHub release.
# Sumi Moji itself ships as the two variable fonts (its statics are the
# JP faces' donors, the Nerd Fonts patch's input and the variable fonts'
# check, not an asset); the JP families ship as statics, zipped. No
# collections: the release unit is the file a user installs.
#
# A family's two weights per job — its Latin donors, its four JP faces,
# their Nerd Fonts patches and a share of the Sumi Moji ones (patched
# while the JP faces build), verified side by side and uploaded as an
# artifact; the package job builds the two variable fonts, assembles
# dist/ from the artifacts, harmonizes the Latin families' win metrics (a
# per-job build never sees a family whole), zips and publishes.
name: Release
on:
  push:
    tags: ["v*"]
    # a branch push whose commit message carries [release-dry] is a dry
    # run: the workflow as of that commit builds and packages, publishes
    # nothing — timing a change to this file before it is on main (a push
    # without the marker runs nothing; workflow_dispatch is not open to
    # every token)
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.4.0)"
        required: true
      dry-run:
        description: "Build and package only: no tag, no release (timing the workflow)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  SUMI_VERSION_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.0.0-dry' }}
  # the runs that publish: a v* tag, or a dispatch without dry-run
  PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
jobs:
  # a family's two weights, both styles, per job (nine jobs: more than
  # about ten queue behind each other): its four Latin donors, its four
  # JP faces, and the Nerd Fonts patches — the JP faces' own, plus a share
  # of the twelve Sumi Moji ones, patched while the JP faces build: the
  # base job the first weight's upright, the 35 job its italic, the Term
  # job (the lightest: its faces need no icon fitting) both of the second
  # weight's, for which it builds the ship donors too. Two of the Term
  # jobs also build one variable font each, for the package job to pick up
  faces:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-dry]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [base, 35, Term]
        weights: [Light Normal, Regular Medium, Bold Heavy]
        include:
          - family: base
            latin: ship
            latin_nf: upright-first
          - family: 35
            latin: ship
            latin_nf: italic-first
          - family: Term
            latin: term
            latin_nf: both-second
          - family: Term
            weights: Light Normal
            variable: upright
          - family: Term
            weights: Regular Medium
            variable: italic
    name: faces (${{ matrix.family }} ${{ matrix.weights }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
        with:
          fontforge: "true"
      - run: echo "SUMI_VERSION=${SUMI_VERSION_TAG#v}" >> "$GITHUB_ENV"
      - run: python scripts/build_latin.py "${{ matrix.weights }} ${{ matrix.latin }}"
      - name: Build the JP faces and patch everything
        env:
          LATIN_NF: ${{ matrix.latin_nf }}
        run: |
          set -- ${{ matrix.weights }}
          case "$LATIN_NF" in
            upright-first) faces="dist/latin/SumiMoji-$1.otf" ;;
            italic-first) faces="dist/latin/SumiMoji-$1Italic.otf" ;;
            both-second)
              python scripts/build_latin.py "$2 ship"
              faces="dist/latin/SumiMoji-$2.otf dist/latin/SumiMoji-$2Italic.otf" ;;
          esac
          python scripts/nerdpatch.py FontPatcher $faces > nerd-latin.log 2>&1 &
          latin=$!
          python scripts/build.py "${{ matrix.weights }} ${{ matrix.family }}"
          python scripts/nerdpatch.py FontPatcher dist/*.otf
          wait $latin || { cat nerd-latin.log; exit 1; }
          cat nerd-latin.log
      - if: matrix.variable
        run: python scripts/build_latin_vf.py ${{ matrix.variable }}
      # the statics and NF faces; a variable font, when this job built one,
      # is dist/latin/SumiMoji*[wght].otf and rides along (verify_latin_vf
      # runs in the package job, against every static)
      - run: >-
          python scripts/verify_many.py
          'dist/*.otf' 'dist/nerd/*.otf' 'dist/latin/SumiMoji-*.otf' 'dist/nerd/latin/*.otf'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faces-${{ matrix.family }}-${{ strategy.job-index }}
          path: |
            dist/*.otf
            dist/latin/*.otf
            dist/latin/term/*.otf
            dist/nerd/*.otf
            dist/nerd/latin/*.otf
          if-no-files-found: error
          retention-days: 7
  # the faces and the variable fonts from the artifacts, then the zips
  # and the release
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: faces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: faces-*
          path: dist
          merge-multiple: true
      - run: python scripts/harmonize_latin.py
      - name: Verify the variable fonts against the static faces
        run: |
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji[wght].otf"
          python scripts/verify_latin_vf.py "dist/latin/SumiMoji-Italic[wght].otf"
      - run: >-
          python scripts/verify_many.py
          dist/latin/SumiMoji-Regular.otf dist/nerd/latin/SumiMojiNF-BoldItalic.otf
      - run: |
          cp LICENSE dist/LICENSE
          cp LICENSE dist/nerd/LICENSE
          cp LICENSE dist/latin/LICENSE
          cp LICENSE dist/nerd/latin/LICENSE
          cd dist && zip -q SumiMojiJP.zip *.otf LICENSE
          (cd latin && zip -q ../SumiMoji.zip 'SumiMoji[wght].otf' 'SumiMoji-Italic[wght].otf' LICENSE)
          cd nerd && zip -q ../SumiMojiJP-NerdFont.zip *.otf LICENSE
          (cd latin && zip -q ../../SumiMoji-NerdFont.zip *.otf LICENSE)
      # every asset, on a dry run too (a missing one is a failure here, not
      # a warning from the release step)
      - run: ls -l dist/*.zip
      - name: Extract changelog section for this tag
        run: |
          awk -v tag="## ${SUMI_VERSION_TAG}" '
            $0 == tag {flag=1; next}
            flag && /^## / {flag=0}
            flag
          ' CHANGELOG.md > release_notes.md
      - if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # on dispatch the tag doesn't exist yet; gh-release creates it
          # at the built commit. Tag pushes keep working unchanged.
          tag_name: ${{ env.SUMI_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/SumiMojiJP.zip
            dist/SumiMoji.zip
            dist/SumiMojiJP-NerdFont.zip
            dist/SumiMoji-NerdFont.zip
