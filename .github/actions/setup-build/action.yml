# The steps every build job of ci.yml / release.yml starts with: Python and
# the requirements, and the pinned upstreams (fetch-upstreams, cached)
# exported as the build scripts' environment variables — the Symbols Nerd
# Font Mono among them (nerdpatch.py grafts it; no FontForge, no
# font-patcher).
name: Set up a build job
description: >
  Python + requirements, the pinned upstream fonts exported as SHS_DIR /
  SCP_VF_U / SCP_VF_I / MONA_VF / NF_SYMBOLS / NF_LICENSE.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
    - shell: bash
      run: pip install -r requirements.txt
    - name: Fetch upstreams
      id: upstreams
      uses: ./.github/actions/fetch-upstreams
    - name: Export upstream paths
      shell: bash
      run: |
        echo "SHS_DIR=${{ steps.upstreams.outputs.shs_dir }}" >> "$GITHUB_ENV"
        echo "SCP_VF_U=${{ steps.upstreams.outputs.scp_vf_u }}" >> "$GITHUB_ENV"
        echo "SCP_VF_I=${{ steps.upstreams.outputs.scp_vf_i }}" >> "$GITHUB_ENV"
        echo "MONA_VF=${{ steps.upstreams.outputs.mona_vf }}" >> "$GITHUB_ENV"
        echo "NF_SYMBOLS=${{ steps.upstreams.outputs.nf_symbols }}" >> "$GITHUB_ENV"
        echo "NF_LICENSE=${{ steps.upstreams.outputs.nf_license }}" >> "$GITHUB_ENV"
